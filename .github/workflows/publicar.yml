# Publica o app no GitHub Pages a cada push no main.
# Endereço: https://peseogo-stack.github.io/Telecom.estudos/
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # para gravar o site compilado no branch gh-pages

concurrency:
  group: publicar
  cancel-in-progress: true

jobs:
  publicar:
    # Só publica depois que os testes no navegador passarem: um teste vermelho não vai ao ar.
    needs: testes-no-navegador
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Valida o conteúdo (fontes, questões, seções) e compila; falha se algo estiver errado.
      - run: npm run build
      - run: npm test
      - name: Publicar a pasta dist no branch gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'Publica a versão'

  testes-no-navegador:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
